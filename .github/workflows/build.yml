name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project SportTread.xcodeproj -scheme SportTread -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/SportTread.app

      # Ad-hoc signatures carry the HealthKit entitlements into the IPA,
      # so Signulous can see what the app needs when it re-signs.
      - name: Ad-hoc sign with entitlements and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/SportTread.app
          echo "Embedded watch apps:" && ls "$APP/Watch"
          for W in "$APP"/Watch/*.app; do
            codesign -f -s - --entitlements SportTreadWatch/SportTreadWatch.entitlements "$W"
          done
          codesign -f -s - --entitlements SportTread/SportTread.entitlements "$APP"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry SportTread-unsigned.ipa Payload
          ls -la SportTread-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SportTread-ipa
          path: SportTread-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: xcodebuild.log
