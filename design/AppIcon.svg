<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.6" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#7dff4f"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00e0ff"/>
      <stop offset="1" stop-color="#b6ff3c"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- faint track ring -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="56"/>
  <!-- progress ring -->
  <path d="M278.7 745.3 A330 330 0 1 1 745.3 745.3" fill="none" stroke="url(#neon)" stroke-width="56" stroke-linecap="round" filter="url(#glow)"/>
  <!-- speed chevrons -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M385 372 L525 512 L385 652" stroke="url(#neon2)" stroke-width="72" stroke-opacity="0.55"/>
    <path d="M500 372 L640 512 L500 652" stroke="url(#neon2)" stroke-width="72"/>
  </g>
  <!-- treadmill belt lines -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round">
    <line x1="352" y1="786" x2="672" y2="786"/>
  </g>
</svg>
