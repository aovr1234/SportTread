name: SportTread
options:
  bundleIdPrefix: com.andrew
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  SportTread:
    type: application
    platform: iOS
    sources: [SportTread, Shared]
    info:
      path: SportTread/Info.plist
      properties:
        CFBundleDisplayName: SportTread
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Keep talking to the treadmill with the screen locked or in another app
        UIBackgroundModes: [bluetooth-central]
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: SportTread reads your heart rate and workouts to run heart-rate workouts and show your history.
        NSHealthUpdateUsageDescription: SportTread saves your treadmill workouts, distance and calories to Apple Health.
        NSBluetoothAlwaysUsageDescription: SportTread connects to your treadmill and, if you use one, a Bluetooth heart-rate monitor.
        # Show the app's own folder in Files › On My iPhone › SportTread
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Show the iCloud container as iCloud Drive › SportTread (only if the signing provides iCloud)
        NSUbiquitousContainers:
          iCloud.com.andrew.sporttread:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: SportTread
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: SportTread/SportTread.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.andrew.sporttread]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.andrew.sporttread]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew.sporttread
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SportTreadLiveActivity
        embed: true

  SportTreadLiveActivity:
    type: app-extension
    platform: iOS
    sources: [SportTreadLiveActivity, Shared]
    info:
      path: SportTreadLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: SportTread
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew.sporttread.liveactivity
        TARGETED_DEVICE_FAMILY: "1"
