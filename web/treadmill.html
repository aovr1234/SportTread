<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treadmill Control</title>
<style>
  :root { --fg:#111; --bg:#fff; --muted:#666; --line:#ccc; --stop:#c00; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#111; --muted:#999; --line:#444; } }
  body { font: 16px system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 16px; max-width: 640px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  button { font: inherit; padding: 10px 14px; border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  input { font: inherit; width: 5em; padding: 9px; border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .label { width: 70px; color: var(--muted); }
  .readout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .readout div { border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .readout b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .readout span { color: var(--muted); font-size: 13px; }
  #stop { width: 100%; padding: 18px; font-size: 20px; font-weight: 700; color: #fff; background: var(--stop); border-color: var(--stop); }
  #state { color: var(--muted); }
  #log { border: 1px solid var(--line); border-radius: 4px; padding: 8px; height: 180px; overflow-y: auto; font: 13px ui-monospace, monospace; white-space: pre-wrap; }
  @media (max-width: 480px) { .readout { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<h1>Treadmill Control: ProForm 505 CST</h1>

<div class="row">
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <span id="state">Not connected</span>
</div>

<div class="readout">
  <div><b id="mph">–</b><span>mph</span></div>
  <div><b id="inc">–</b><span>incline %</span></div>
  <div><b id="time">0:00</b><span>moving time</span></div>
  <div><b id="dist">0.00</b><span>miles</span></div>
</div>

<button id="stop" disabled>STOP</button>

<div class="row">
  <button id="start" disabled>Start (1.0 mph)</button>
</div>

<div class="row">
  <span class="label">Speed</span>
  <button data-dspeed="-0.5" disabled>−0.5</button>
  <button data-dspeed="-0.1" disabled>−0.1</button>
  <input id="speedIn" type="number" step="0.1" min="0.5" max="6" value="3.0">
  <button id="setSpeed" disabled>Set mph</button>
  <button data-dspeed="0.1" disabled>+0.1</button>
  <button data-dspeed="0.5" disabled>+0.5</button>
</div>

<div class="row">
  <span class="label">Incline</span>
  <button data-dinc="-1" disabled>−1</button>
  <input id="incIn" type="number" step="0.5" min="0" max="10" value="0">
  <button id="setInc" disabled>Set %</button>
  <button data-dinc="1" disabled>+1</button>
</div>

<p style="color:var(--muted);font-size:13px">Limits: 0.5–6.0 mph, 0–10% incline. The console Stop button and safety key always work.</p>

<div id="log"></div>

<script>
"use strict";
// iFit BLE (service 1533) with QZ's proform_treadmill_cst_505_pftl59420_0 profile,
// verified on this treadmill: init, polls, start, speed, incline, pause-stop.
const SVC = "00001533-1412-efde-1523-785feabcd123";
const TXC = "00001534-1412-efde-1523-785feabcd123";
const RXC = "00001535-1412-efde-1523-785feabcd123";
const MAX_MPH = 6.0, MIN_MPH = 0.5, MAX_INC = 10.0;
const KMH = 1.609344;

const H = s => new Uint8Array(s.trim().split(/\s+/).map(x => parseInt(x, 16)));
const Z10 = " 00 00 00 00 00 00 00 00 00 00";
const I1 = "fe 02 08 02", I5 = "fe 02 0a 02";

const INIT = [
  I1, "ff 08 02 04 02 04 02 04 81 87" + Z10,
  I1, "ff 08 02 04 02 04 04 04 80 88" + Z10,
  I1, "ff 08 02 04 02 04 04 04 88 90" + Z10,
  "fe 02 0b 02", "ff 0b 02 04 02 07 02 07 82 00 00 00 8b 00 00 00 00 00 00 00",
  I5, "ff 0a 02 04 02 06 02 06 84 00 00 8c 00 00 00 00 00 00 00 00",
  I1, "ff 08 02 04 02 04 02 04 95 9b" + Z10,
  "fe 02 2c 04",
  "00 12 02 04 02 28 04 28 90 07 01 59 78 a5 c0 e9 10 4d 78 a9",
  "01 12 d8 05 30 79 a0 fd 38 79 b8 e5 20 69 d0 0d 78 a9 18 45",
  "ff 08 b0 19 40 98 02 00 00 59" + Z10,
  "fe 02 19 03", "00 12 02 04 02 15 04 15 02 0e 00 00 00 00 00 00 00 00 00 00", "ff 07 00 00 00 10 01 00 3a 00" + Z10,
  "fe 02 17 03", "00 12 02 04 02 13 04 13 02 0c 00 00 00 00 00 00 00 00 00 00", "ff 05 00 80 00 00 a5 00 00 00" + Z10,
  "fe 02 19 03", "00 12 02 04 02 15 04 15 02 00 0f 00 10 00 d8 1c 48 00 00 e0", "ff 07 00 00 00 10 00 08 6e 00" + Z10,
  "fe 02 14 03", "00 12 02 04 02 10 04 10 02 00 0a 13 94 33 00 10 40 10 00 80", "ff 02 18 f2 00 00 00 00 00 00" + Z10,
  "fe 02 10 02", "ff 10 02 04 02 0c 04 0c 02 04 00 00 00 02 35 25 00 72 00 00",
  "fe 02 19 03", "00 12 02 04 02 15 04 15 02 0e 00 00 00 00 00 00 00 00 00 00", "ff 07 00 00 00 10 01 00 3a 00" + Z10,
  "fe 02 10 02", "ff 10 02 04 02 0c 04 0c 02 05 00 00 00 00 10 00 00 27 00 00",
].map(H);

// Each poll is one 3-frame message (fe header, body, ff tail); never split one.
const POLL = [
  "fe 02 19 03",
  "00 12 02 04 02 15 04 15 02 00 0f 80 02 40 00 00 00 00 00 00",
  "ff 07 00 00 00 95 00 10 91 00" + Z10,
  "fe 02 14 03",
  "00 12 02 04 02 10 04 10 02 00 0a 13 94 33 00 10 40 10 00 80",
  "ff 02 18 f2 00 00 00 00 00 00" + Z10,
].map(H);

// QZ proform_treadmill_505_cst start1..start5 (starts the belt at 1.0 mph)
const START = [
  "fe 02 20 03",
  "00 12 02 04 02 1c 04 1c 02 09 00 00 40 02 18 40 00 00 80 30",
  "ff 0e 2a 00 00 ef 1a 58 02 00 b4 00 58 02 00 10 00 00 00 00",
  "fe 02 11 02",
  "ff 11 02 04 02 0d 04 0d 02 02 03 10 a0 00 00 00 0a 00 d2 00",
].map(H);

// Single-message write: 6 command bytes at [8..13], checksum = sum of bytes [6..13]
function write6(bytes) {
  const w = new Uint8Array(20);
  w.set([0xff, 0x0d, 0x02, 0x04, 0x02, 0x09, 0x04, 0x09]);
  w.set(bytes, 8);
  let s = 0;
  for (let i = 6; i < 14; i++) s += w[i];
  w[14] = s & 0xff;
  return [H("fe 02 0d 02"), w];
}
const speedFrames = mph => { const v = Math.round(mph * KMH * 100); return write6([0x02, 0x01, 0x01, v & 0xff, v >> 8, 0]); };
const inclineFrames = pct => { const v = Math.round(pct * 100); return write6([0x02, 0x01, 0x02, v & 0xff, v >> 8, 0]); };
const pauseFrames = () => write6([0x02, 0x02, 0x00, 0x10, 0x03, 0x00]);  // workout mode 3 = pause (stops belt)

let device = null, tx = null, connected = false, ready = false;
let queue = [];               // {at, label, frames: Uint8Array[][]}
const st = { mph: null, inc: null, lastData: 0, movingMs: 0, miles: 0, lastTick: 0 };
const commanded = { speedAt: 0, incAt: 0 };

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function log(msg) {
  const t = new Date().toLocaleTimeString();
  const el = $("log");
  el.textContent += `${t}  ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
function setState(s) { $("state").textContent = s; }
function setControls(on) {
  document.querySelectorAll("#stop,#start,#setSpeed,#setInc,[data-dspeed],[data-dinc]").forEach(b => b.disabled = !on);
  $("disconnect").disabled = !connected;
  $("connect").disabled = connected;
}

async function txFrame(f) { await tx.writeValueWithResponse(f); }

function onNotify(e) {
  const v = e.target.value;
  const d = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  if (!ready || d.length !== 20) return;
  if (d[0] === 0x00 && d[1] === 0x12 && d[2] === 0x01 && d[3] === 0x04 && d[4] === 0x02 && d[5] !== 0x20 && d[9] === 0x02) {
    const mph = (d[10] | (d[11] << 8)) / 100 / KMH;
    const inc = (((d[12] | (d[13] << 8)) << 16) >> 16) / 100;
    const now = Date.now();
    // A change nobody commanded from here in the last 4 s came from the console
    if (st.mph !== null && Math.abs(mph - st.mph) >= 0.05 && now - commanded.speedAt > 4000)
      log(`Speed changed on console: ${mph.toFixed(1)} mph`);
    if (st.inc !== null && Math.abs(inc - st.inc) >= 0.05 && now - commanded.incAt > 4000)
      log(`Incline changed on console: ${inc.toFixed(1)}%`);
    st.mph = mph; st.inc = inc; st.lastData = now;
    render();
  } else if (d[0] === 0xff && d[1] === 0x09 && d[2] === 0x01 && d[3] === 0x04 && d[4] === 0x02 && d[9] !== 0x02) {
    log(`Treadmill refused a command (status ${d[9].toString(16).padStart(2, "0")})`);
  }
}

function render() {
  $("mph").textContent = st.mph === null ? "–" : st.mph.toFixed(1);
  $("inc").textContent = st.inc === null ? "–" : st.inc.toFixed(1);
  const s = Math.floor(st.movingMs / 1000);
  $("time").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("dist").textContent = st.miles.toFixed(2);
}

setInterval(() => {
  const now = Date.now();
  if (st.lastTick && st.mph > 0) {
    const dt = now - st.lastTick;
    st.movingMs += dt;
    st.miles += st.mph * dt / 3600000;
  }
  st.lastTick = now;
  if (ready && now - st.lastData > 5000) setState("Connected, no data for 5 s");
  else if (ready) setState(st.mph > 0 ? "Running" : "Stopped");
  render();
}, 500);

function enqueue(label, frames, delayMs = 0) {
  queue.push({ at: Date.now() + delayMs, label, frames });
}

async function pollLoop() {
  let i = 0;
  while (connected) {
    try {
      if (i % 3 === 0 && queue.length && Date.now() >= queue[0].at) {
        const job = queue.shift();
        log(`> ${job.label}`);
        for (const f of job.frames) { await txFrame(f); await sleep(200); }
        continue;
      }
      await txFrame(POLL[i % POLL.length]);
      i++;
      await sleep(200);
    } catch (err) {
      if (connected) log(`Write error: ${err.message}`);
      await sleep(500);
    }
  }
}

async function connect() {
  if (!navigator.bluetooth) { log("This browser has no Web Bluetooth. Use Chrome or Edge."); return; }
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }, { namePrefix: "I_TL" }], optionalServices: [SVC] });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    setState("Connecting…");
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    tx = await svc.getCharacteristic(TXC);
    const rx = await svc.getCharacteristic(RXC);
    await rx.startNotifications();
    rx.addEventListener("characteristicvaluechanged", onNotify);
    connected = true; setControls(false);
    setState("Handshake (about 20 s)…");
    for (const f of INIT) { await txFrame(f); await sleep(600); }
    ready = true;
    log(`Connected to ${device.name || "treadmill"}`);
    setControls(true);
    pollLoop();
  } catch (err) {
    log(`Connect failed: ${err.message}`);
    setState("Not connected");
    connected = false; ready = false; setControls(false);
  }
}

function onDisconnected() {
  connected = false; ready = false; queue = [];
  setState("Disconnected"); setControls(false);
  log("Disconnected from treadmill");
}

async function disconnect() {
  if (st.mph > 0) {
    enqueue("Stop before disconnect", pauseFrames());
    for (let t = 0; t < 30 && queue.length; t++) await sleep(100);
    await sleep(1500);
  }
  connected = false;
  if (device && device.gatt.connected) device.gatt.disconnect();
}

function setSpeed(mph) {
  mph = Math.round(mph * 10) / 10;
  if (!(mph >= MIN_MPH && mph <= MAX_MPH)) { log(`Speed ${mph} mph is outside ${MIN_MPH}–${MAX_MPH}`); return; }
  if (!(st.mph > 0)) { log("Belt is stopped. Press Start first."); return; }
  $("speedIn").value = mph.toFixed(1);
  commanded.speedAt = Date.now();
  enqueue(`Speed ${mph.toFixed(1)} mph`, speedFrames(mph));
}
function setIncline(pct) {
  pct = Math.round(pct * 2) / 2;
  if (!(pct >= 0 && pct <= MAX_INC)) { log(`Incline ${pct}% is outside 0–${MAX_INC}`); return; }
  $("incIn").value = pct;
  commanded.incAt = Date.now();
  enqueue(`Incline ${pct}%`, inclineFrames(pct));
}

$("connect").onclick = connect;
$("disconnect").onclick = disconnect;
$("stop").onclick = () => { queue = []; commanded.speedAt = Date.now(); enqueue("STOP", pauseFrames()); };
$("start").onclick = () => {
  commanded.speedAt = Date.now();
  enqueue("Start", START);
  enqueue("Speed 1.0 mph", speedFrames(1.0), 1500);
};
$("setSpeed").onclick = () => setSpeed(parseFloat($("speedIn").value));
$("setInc").onclick = () => setIncline(parseFloat($("incIn").value));
document.querySelectorAll("[data-dspeed]").forEach(b => b.onclick = () =>
  setSpeed((st.mph ?? parseFloat($("speedIn").value)) + parseFloat(b.dataset.dspeed)));
document.querySelectorAll("[data-dinc]").forEach(b => b.onclick = () =>
  setIncline((st.inc ?? parseFloat($("incIn").value)) + parseFloat(b.dataset.dinc)));
setControls(false);
if (!navigator.bluetooth) log("This browser has no Web Bluetooth. Open this page in Chrome or Edge.");
</script>
</body>
</html>
